name: CI

"on": [push, workflow_dispatch]

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install shellcheck and gawk (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck gawk  # macOS ships BSD awk; the scripts require gawk (see README)
      - name: Shellcheck the shipped scripts
        run: shellcheck --severity=warning scripts/*.sh devtools/*.sh  # developer runner retains the same lint coverage
      - name: Bash syntax check (bash -n)
        run: |
          echo "Running bash -n on all shipped scripts"
          for s in scripts/*.sh devtools/*.sh assets/*.sh companions/contract-forge/scripts/*.sh companions/contract-forge/tests/*.sh; do
            bash -n "$s" || exit 1
          done
          echo "All shipped scripts passed bash -n"
      - name: Docs consistency (invariants, packs, legacy R index)
        run: bash tests/docs_consistency.sh
      - name: Scenario test suite (gate semantics, no API needed)
        run: |
          bash tests/run_tests.sh
      - name: Companion contract-forge lint fixtures
        run: bash companions/contract-forge/tests/run_fixtures.sh
      - name: Budget, ledger access, commit and recovery tests
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
