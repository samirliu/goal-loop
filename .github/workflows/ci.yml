name: CI

"on": [push, workflow_dispatch]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Shellcheck the shipped scripts
        run: shellcheck --severity=warning scripts/*.sh  # info-level style hints stay in logs; warnings+errors block (parity with tests/run_tests.sh #33)
      - name: Bash syntax check (bash -n)
        run: |
          echo "Running bash -n on all shipped scripts"
          for s in scripts/*.sh assets/*.sh companions/contract-forge/scripts/*.sh companions/contract-forge/tests/*.sh; do
            bash -n "$s" || exit 1
          done
          echo "All shipped scripts passed bash -n"
      - name: Docs consistency (invariants, packs, legacy R index)
        run: bash tests/docs_consistency.sh
      - name: Scenario test suite (gate semantics, no API needed)
        run: |
          bash tests/run_tests.sh
          bash tests/run_tests.sh 2>/dev/null | grep -E '^== results'
      - name: Companion contract-forge lint fixtures
        run: bash companions/contract-forge/tests/run_fixtures.sh
